<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宿说</title>
<link rel="stylesheet" href="/design-system.css?v=2">
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink-secondary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  max-width: 100vw;
  overflow-x: hidden;
}

.container { max-width: 640px; margin: 0 auto; padding: 0 20px; }

/* ---- Hero ---- */
.hero {
  position: relative;
  min-height: 360px;
  display: flex; align-items: flex-end;
  border-radius: 0 0 24px 24px;
  overflow: hidden;
  margin-bottom: 24px;
}
.hero-bg {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, var(--primary-bg), var(--bg-alt));
}
.hero-bg img {
  width: 100%; height: 100%; object-fit: cover;
  position: absolute; inset: 0;
}
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.05) 60%);
}
.hero-body {
  position: relative; z-index: 2;
  padding: 40px 24px 28px;
  color: #fff;
  width: 100%;
  max-width: 640px; margin: 0 auto;
}
.hero-body .logo-img {
  width: 64px; height: 64px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255,255,255,0.7);
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  margin-bottom: 12px;
}
.hero-body .logo-emoji { font-size: 56px; margin-bottom: 8px; }
.hero-body h1 {
  font-family: var(--font-serif);
  font-size: 28px; font-weight: 700;
  text-shadow: 0 1px 4px rgba(0,0,0,0.25);
  letter-spacing: 2px;
}
.hero-body .desc {
  font-size: 14px; margin-top: 6px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  opacity: 0.9; max-width: 380px;
}
.hero-body .addr { font-size: 12px; margin-top: 4px; opacity: 0.7; }
.hero-body .tags { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
.hero-body .tag-item {
  font-size: 11px; font-weight: 500;
  padding: 3px 12px;
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 20px;
  background: rgba(255,255,255,0.12);
}

/* ---- Section ---- */
.section { padding: 36px 0; }
.section-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 6px;
}
.section-head .icon { font-size: 22px; }
.section-head h2 {
  font-family: var(--font-serif);
  font-size: 20px; font-weight: 700;
  color: var(--ink); letter-spacing: 1px;
}
.section-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }

/* ---- Card ---- */
.card {
  background: var(--surface);
  border-radius: 14px;
  padding: 18px 20px;
  border: 1px solid var(--border-light);
  margin-bottom: 10px;
}

/* ---- Guide Steps ---- */
.guide-step {
  display: flex; gap: 16px; align-items: flex-start;
  margin-bottom: 18px;
}
.guide-step .step-no {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700;
  flex-shrink: 0;
}
.guide-step .step-body { flex: 1; }
.guide-step .step-body h3 { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.guide-step .step-body p { font-size: 13px; color: var(--ink-secondary); line-height: 1.7; }
.guide-step .step-body img { margin-top: 10px; border-radius: 10px; max-width: 100%; }

/* ---- Horizontal Scroll ---- */
.scroll-x {
  display: flex; gap: 14px;
  overflow-x: auto; padding-bottom: 6px;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x mandatory;
}
.scroll-x > * { scroll-snap-align: start; flex-shrink: 0; }

/* ---- Attraction Card ---- */
.attr-card {
  width: 200px;
  background: var(--surface);
  border-radius: 14px; overflow: hidden;
  border: 1px solid var(--border-light);
}
.attr-card .img-wrap {
  height: 120px; background: var(--bg-alt);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
}
.attr-card .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.attr-card .info { padding: 12px 14px; }
.attr-card .info h3 { font-size: 14px; font-weight: 600; color: var(--ink); }
.attr-card .info p { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }

/* ---- Map Image ---- */
.map-img { margin-top: 20px; }
.map-img img { width: 100%; border-radius: 12px; border: 1px solid var(--border); }

/* ---- Route Card ---- */
.route-method {
  font-size: 11px; font-weight: 600;
  padding: 2px 10px;
  border-radius: 10px;
  background: var(--primary-bg);
  color: var(--primary);
}

/* ---- Food ---- */
.food-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  background: var(--bg-alt);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
}

/* ---- Product Grid ---- */
.product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.product-card {
  background: var(--surface);
  border-radius: 14px; overflow: hidden;
  border: 1px solid var(--border-light);
}
.product-img {
  height: 130px; background: var(--bg-alt);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
}
.product-img img { width: 100%; height: 100%; object-fit: cover; }
.product-body { padding: 12px 14px; }
.product-body h3 { font-size: 13px; font-weight: 600; color: var(--ink); }
.product-body .desc { font-size: 11px; color: var(--muted); margin: 3px 0 8px; line-height: 1.4; }
.product-body .row { display: flex; align-items: center; justify-content: space-between; }
.product-body .price { font-size: 16px; font-weight: 700; color: var(--primary); }

/* ---- Tips ---- */
.tip-row {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 0;
  border-bottom: 1px solid var(--border-light);
}
.tip-row:last-child { border-bottom: none; }
.tip-icon { font-size: 26px; flex-shrink: 0; }

/* ---- Facilities/Business/Nearby ---- */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.grid-card {
  background: var(--surface);
  border-radius: 12px; padding: 16px;
  border: 1px solid var(--border-light);
  display: flex; align-items: flex-start; gap: 10px;
}
.grid-card .g-icon { font-size: 22px; flex-shrink: 0; }
.grid-card .g-info h3 { font-size: 14px; font-weight: 600; color: var(--ink); }
.grid-card .g-info p { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ---- Messages ---- */
.msg-bar {
  display: flex; gap: 8px;
}
.msg-input {
  flex: 1; padding: 10px 18px;
  border: 1px solid var(--border);
  border-radius: 24px;
  font-size: 14px; font-family: var(--font-sans);
  background: var(--surface); outline: none;
  transition: border-color 0.15s;
}
.msg-input:focus { border-color: var(--primary); }
.msg-feedback {
  color: var(--success); font-size: 12px; font-weight: 500;
  margin-top: 6px; display: none;
}
.msg-feedback.show { display: block; }
.marquee {
  margin-top: 18px; overflow: hidden;
  background: var(--bg-alt);
  border-radius: 10px; padding: 10px 14px;
  border: 1px solid var(--border-light);
}
.marquee-track { display: inline-block; white-space: nowrap; animation: marquee 30s linear infinite; }
@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ---- Map Nav Button ---- */
.btn-map {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 500; color: var(--primary);
  padding: 5px 14px;
  border: 1px solid var(--primary);
  border-radius: 16px;
  background: transparent; cursor: pointer;
  font-family: var(--font-sans);
}

/* ---- Modal ---- */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4); z-index: 1000;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 28px 24px 36px;
  width: 100%; max-width: 420px;
  animation: slideUp 0.25s ease-out;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-sheet h3 { font-size: 17px; color: var(--ink); margin-bottom: 18px; text-align: center; }
.modal-sheet .btn { width: 100%; margin-bottom: 10px; padding: 14px; border-radius: 24px; border: none; font-size: 14px; font-weight: 500; font-family: var(--font-sans); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.modal-sheet .btn-wechat { background: #07c160; color: #fff; }
.modal-sheet .btn-call { background: var(--primary); color: #fff; }
.modal-sheet .btn-cancel { width: 100%; margin-top: 4px; padding: 12px; background: none; border: 1px solid var(--border); border-radius: 24px; color: var(--muted); font-size: 13px; cursor: pointer; font-family: var(--font-sans); }

/* ---- Footer ---- */
.page-footer {
  text-align: center; padding: 32px 20px 48px;
  color: var(--muted-light); font-size: 12px;
  letter-spacing: 1px;
}

/* ---- Responsive ---- */
@media (min-width: 640px) {
  .product-grid { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: repeat(3, 1fr); }
  .attr-card { width: 220px; }
}

/* ---- Reveal Animation ---- */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }

.hero-body h1:empty::after { content: '加载中...'; color: rgba(255,255,255,0.6); }

</style>
</head>
<body>

<!-- Hero -->
<section class="hero" id="heroSection">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-body">
    <div id="heroLogo"><span class="logo-emoji">🏡</span></div>
    <h1 id="heroName"></h1>
    <p class="desc" id="heroDesc"></p>
    <p class="addr" id="heroAddr"></p>
    <div class="tags" id="heroTags"></div>
  </div>
</section>

<div class="container">

<!-- Guide -->
<section class="section reveal" id="guide">
  <div class="section-head"><span class="icon">🚪</span><h2>入住导引</h2></div>
  <p class="section-sub">跟着步骤走，轻松找到我们</p>
  <div id="guideSteps"></div>
</section>

<!-- Attractions -->
<section class="section reveal" id="attractions">
  <div class="section-head"><span class="icon">🗺️</span><h2>周边攻略</h2></div>
  <p class="section-sub">探索附近的好去处</p>
  <div class="scroll-x" id="attrList"></div>
  <div class="map-img" id="guideMapWrap"></div>
</section>

<!-- Routes -->
<section class="section reveal" id="routes">
  <div class="section-head"><span class="icon">📍</span><h2>到达路线</h2></div>
  <p class="section-sub">多种方式，轻松抵达</p>
  <div id="routeList"></div>
</section>

<!-- Food -->
<section class="section reveal" id="food">
  <div class="section-head"><span class="icon">🍜</span><h2>周边美食</h2></div>
  <p class="section-sub">本地人都爱去的老店</p>
  <div id="foodList"></div>
</section>

<!-- Products -->
<section class="section reveal" id="products">
  <div class="section-head"><span class="icon">🛍️</span><h2>好物推荐</h2></div>
  <p class="section-sub">把这里的味道带回家</p>
  <div class="product-grid" id="productList"></div>
</section>

<!-- Facilities -->
<section class="section reveal" id="facilities">
  <div class="section-head"><span class="icon">🏊</span><h2>设施服务</h2></div>
  <p class="section-sub">为舒适入住保驾护航</p>
  <div class="grid-2" id="facilityList"></div>
</section>

<!-- Business -->
<section class="section reveal" id="business">
  <div class="section-head"><span class="icon">💼</span><h2>商务服务</h2></div>
  <p class="section-sub">满足您的商务需求</p>
  <div class="grid-2" id="bizList"></div>
</section>

<!-- Nearby -->
<section class="section reveal" id="nearby">
  <div class="section-head"><span class="icon">🛒</span><h2>周边便利</h2></div>
  <p class="section-sub">日常生活所需，步行可达</p>
  <div id="nearList"></div>
</section>

<!-- Tips -->
<section class="section reveal" id="tips">
  <div class="section-head"><span class="icon">💡</span><h2>温馨提示</h2></div>
  <p class="section-sub">入住小贴士</p>
  <div class="card" id="tipsContent"></div>
</section>

<!-- Messages -->
<section class="section reveal" id="messages">
  <div class="section-head"><span class="icon">📝</span><h2>住客留言</h2></div>
  <p class="section-sub">听听大家怎么说</p>
  <div class="msg-bar">
    <input class="msg-input" id="msgInput" type="text" maxlength="200" placeholder="分享您的入住体验...">
    <button class="btn-primary" onclick="submitMsg()" style="padding:10px 20px;font-size:14px;">发送</button>
  </div>
  <p class="msg-feedback" id="msgOk">收到您的反馈 💚</p>
  <div class="marquee"><div class="marquee-track" id="marqueeTrack"></div></div>
</section>

</div>

<!-- Footer -->
<div class="page-footer">宿说 · 让住所替你说</div>

<!-- Buy Modal -->
<div class="modal-overlay" id="buyModal">
  <div class="modal-sheet">
    <h3 id="modalTitle">购买商品</h3>
    <button class="btn btn-wechat" id="modalWechat">📱 微信联系 — 复制微信号</button>
    <button class="btn btn-call" id="modalCall">📞 电话联系 — 直接拨打</button>
    <button class="btn-cancel" onclick="closeBuyModal()">取消</button>
  </div>
</div>

<script>
const SLUG = decodeURIComponent(window.location.pathname.split('/p/')[1]?.split('/')[0] || '');
const API = '/api/p/' + SLUG;
let initRunning = false;
let initDone = false;

async function getJSON(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(path + ' fetch failed');
  return r.json();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Apply theme
async function applyTheme() {
  try {
    const mod = await getJSON('/modules');
    const theme = mod.theme || 'default';
    const themeClass = theme === 'default' ? '' : 'theme-' + theme;
    document.documentElement.className = themeClass;
    return mod;
  } catch(e) {
    return {};
  }
}

// Hero
async function loadHomestay() {
  const d = await getJSON('/homestay');
  document.title = d.name + ' - 宿说';

  const logoEl = document.getElementById('heroLogo');
  if (d.logo) {
    logoEl.innerHTML = '<img src="' + esc(d.logo) + '" alt="logo" class="logo-img">';
  }

  if (d.coverImage) {
    document.getElementById('heroBg').innerHTML = '<img src="' + esc(d.coverImage) + '" alt="">';
  }

  document.getElementById('heroName').textContent = d.name;
  document.getElementById('heroDesc').textContent = d.description || '';
  document.getElementById('heroAddr').textContent = d.address ? '📍 ' + d.address : '';
  document.getElementById('heroTags').innerHTML = (d.tags || []).map(t => '<span class="tag-item">' + esc(t) + '</span>').join('');
}

// Guide
async function loadGuide() {
  const d = await getJSON('/guide');
  document.getElementById('guideSteps').innerHTML = (d.steps || []).map((s, i) => `
    <div class="guide-step">
      <div class="step-no">${i + 1}</div>
      <div class="step-body">
        <h3>${esc(s.title)}</h3>
        <p>${esc(s.description)}</p>
        ${s.image ? '<img src="' + esc(s.image) + '" alt="' + esc(s.title) + '">' : ''}
      </div>
    </div>
  `).join('');
}

// Attractions
async function loadAttractions() {
  const d = await getJSON('/attractions');
  document.getElementById('attrList').innerHTML = (d.items || []).map(a => `
    <div class="attr-card">
      <div class="img-wrap">${a.image ? '<img src="' + esc(a.image) + '" alt="' + esc(a.name) + '">' : '🏔️'}</div>
      <div class="info"><h3>${esc(a.name)}</h3><p>${esc(a.description)}</p></div>
    </div>
  `).join('');
  const mw = document.getElementById('guideMapWrap');
  mw.innerHTML = d.guideMapImage ? '<img src="' + esc(d.guideMapImage) + '" alt="导览图">' : '';
}

// Routes
async function loadRoutes() {
  const d = await getJSON('/routes');
  document.getElementById('routeList').innerHTML = (d.items || []).map(r => `
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
        <strong style="color:var(--ink);">${esc(r.from)}</strong>
        <span class="route-method">${esc(r.method)}</span>
      </div>
      <p style="font-size:13px;color:var(--ink-secondary);line-height:1.7;">${esc(r.description)}</p>
    </div>
  `).join('');
}

function openMapNav(lat, lng, name) {
  const ua = navigator.userAgent || '';
  if (/iphone|ipad|ipod/i.test(ua)) {
    window.location.href = 'iosamap://path?sourceApplication=homestay&dlat=' + lat + '&dlng=' + lng + '&dname=' + encodeURIComponent(name) + '&dev=0&t=0';
    setTimeout(() => { window.location.href = 'https://uri.amap.com/navigation?to=' + lng + ',' + lat + ',' + encodeURIComponent(name) + '&mode=car&coordinate=gaode'; }, 600);
  } else {
    window.location.href = 'amapuri://route/plan/?dlat=' + lat + '&dlng=' + lng + '&dname=' + encodeURIComponent(name) + '&dev=0&t=0';
    setTimeout(() => { window.location.href = 'https://uri.amap.com/navigation?to=' + lng + ',' + lat + ',' + encodeURIComponent(name) + '&mode=car&coordinate=gaode'; }, 600);
  }
}

// Food
async function loadFood() {
  const d = await getJSON('/food');
  const icons = ['🥘','🍜','🫘','🥩','🍲','🥟','🍛','🍢'];
  document.getElementById('foodList').innerHTML = (d.items || []).map((f, i) => `
    <div class="card" style="display:flex;align-items:flex-start;gap:12px;">
      <div class="food-icon">${icons[i] || '🍽️'}</div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
          <strong style="color:var(--ink);font-size:15px;">${esc(f.name)}</strong>
          <span style="font-size:12px;color:var(--primary);">${esc(f.dish)}</span>
        </div>
        <p style="font-size:13px;color:var(--ink-secondary);margin:4px 0 8px;line-height:1.6;">${esc(f.description)}</p>
        ${f.lat && f.lng ? '<button class="btn-map" onclick="openMapNav(' + f.lat + ',' + f.lng + ",'" + esc(f.name) + "')\">📍 导航去这里</button>" : ''}
      </div>
    </div>
  `).join('');
}

// Products
async function loadProducts() {
  const d = await getJSON('/products');
  document.getElementById('productList').innerHTML = (d.items || []).map(p => `
    <div class="product-card">
      <div class="product-img">${p.image ? '<img src="' + esc(p.image) + '" alt="' + esc(p.name) + '" loading="lazy">' : '🎁'}</div>
      <div class="product-body">
        <h3>${esc(p.name)}</h3>
        <p class="desc">${esc(p.description)}</p>
        <div class="row"><span class="price">¥${p.price}</span><button class="btn-primary" style="font-size:11px;padding:5px 14px;" onclick="openBuyModal('${esc(p.name)}','${esc(p.wechat)}','${esc(p.phone)}')">购买</button></div>
      </div>
    </div>
  `).join('');
}

function openBuyModal(name, wechat, phone) {
  document.getElementById('modalTitle').textContent = '购买 ' + name;
  document.getElementById('modalWechat').onclick = () => {
    navigator.clipboard.writeText(wechat).then(() => {
      alert('微信号已复制：' + wechat + '\n\n请打开微信添加好友');
    }).catch(() => { alert('微信号：' + wechat + '\n\n请手动复制后添加微信'); });
  };
  document.getElementById('modalCall').onclick = () => { window.location.href = 'tel:' + phone; };
  document.getElementById('buyModal').classList.add('open');
}
function closeBuyModal() { document.getElementById('buyModal').classList.remove('open'); }
document.getElementById('buyModal').addEventListener('click', function(e) { if (e.target === this) closeBuyModal(); });

// Tips
async function loadTips() {
  const d = await getJSON('/tips');
  document.getElementById('tipsContent').innerHTML = `
    <div class="tip-row"><span class="tip-icon">📶</span><div><strong style="color:var(--ink);">WiFi</strong><br><span style="font-size:13px;color:var(--muted);">${esc(d.wifi)} — 密码：${esc(d.wifiPassword)}</span></div></div>
    <div class="tip-row"><span class="tip-icon">🕐</span><div><strong style="color:var(--ink);">退房时间</strong><br><span style="font-size:13px;color:var(--muted);">${esc(d.checkOutTime)}</span></div></div>
    <div class="tip-row"><span class="tip-icon">📞</span><div><strong style="color:var(--ink);">紧急联系电话</strong><br><span style="font-size:13px;color:var(--muted);">${esc(d.emergencyPhone)}</span></div></div>
    ${(d.notices || []).length ? '<div style="margin-top:12px;padding-top:12px;"><strong style="color:var(--ink);display:block;margin-bottom:8px;">📋 入住须知</strong>' + d.notices.map(n => '<p style="font-size:13px;color:var(--muted);padding:4px 0;">• ' + esc(n) + '</p>').join('') + '</div>' : ''}
  `;
}

// Messages
async function loadMessages() {
  const d = await getJSON('/messages');
  const texts = d.map(m => '"' + esc(m.content) + '"').join('  ·  ');
  document.getElementById('marqueeTrack').textContent = texts + (texts ? '  ·  ' + texts : '');
}
async function submitMsg() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text) return;
  const r = await fetch(API + '/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content:text}) });
  if (r.ok) {
    inp.value = '';
    const ok = document.getElementById('msgOk');
    ok.classList.add('show');
    setTimeout(() => ok.classList.remove('show'), 3000);
    loadMessages();
  }
}
document.getElementById('msgInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') submitMsg(); });

// Facilities
async function loadFacilities() {
  const d = await getJSON('/facilities');
  document.getElementById('facilityList').innerHTML = (d.items || []).map(f => `
    <div class="grid-card">
      <span class="g-icon">${esc((f.name || '').split(' ')[0] || '🏊')}</span>
      <div class="g-info"><h3>${esc((f.name || '').replace(/^[^\s]+ /,'') || f.name)}</h3><p>${esc(f.description)}</p></div>
    </div>
  `).join('');
}

// Business
async function loadBusiness() {
  const d = await getJSON('/business');
  document.getElementById('bizList').innerHTML = (d.items || []).map(b => `
    <div class="grid-card">
      <span class="g-icon">${esc((b.name || '').split(' ')[0] || '💼')}</span>
      <div class="g-info"><h3>${esc((b.name || '').replace(/^[^\s]+ /,'') || b.name)}</h3><p>${esc(b.description)}</p></div>
    </div>
  `).join('');
}

// Nearby
async function loadNearby() {
  const d = await getJSON('/nearby');
  const icons = ['🏪','🚇','🏥','💊','🏦','🏫','🛍️','🍎'];
  document.getElementById('nearList').innerHTML = (d.items || []).map((n, i) => `
    <div class="card" style="display:flex;align-items:flex-start;gap:12px;">
      <div class="food-icon">${icons[i] || '📍'}</div>
      <div style="flex:1;min-width:0;">
        <strong style="color:var(--ink);font-size:15px;">${esc(n.name)}</strong>
        <p style="font-size:13px;color:var(--ink-secondary);margin:4px 0 8px;line-height:1.6;">${esc(n.description)}</p>
        ${n.lat && n.lng ? '<button class="btn-map" onclick="openMapNav(' + n.lat + ',' + n.lng + ",'" + esc(n.name) + "')\">📍 导航去这里</button>" : ''}
      </div>
    </div>
  `).join('');
}

// Init
async function init() {
  if (initRunning) return;
  initRunning = true;
  try {
    const modResp = await applyTheme();
    const modules = modResp.modules || null;

    const loaders = {
      homestay: loadHomestay, guide: loadGuide, attractions: loadAttractions,
      routes: loadRoutes, food: loadFood, products: loadProducts, tips: loadTips,
      messages: loadMessages, facilities: loadFacilities, business: loadBusiness, nearby: loadNearby,
    };

    const tasks = [];
    const allSections = ['guide','attractions','routes','food','products','tips','messages','facilities','business','nearby'];

    // Always load homestay (hero)
    if (loaders.homestay) tasks.push(loaders.homestay());

    allSections.forEach(name => {
      const section = document.getElementById(name);
      if (!section) return;
      if (!modules || modules.includes(name)) {
        if (loaders[name]) tasks.push(loaders[name]());
      } else {
        section.style.display = 'none';
      }
    });

    await Promise.all(tasks);

    // Reveal animations
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    initDone = true;
  } catch(err) {
    console.error('Page init error:', err);
  } finally {
    initRunning = false;
  }
}

document.addEventListener('DOMContentLoaded', init);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !initDone && !initRunning) init();
});
</script>
</body>
</html>
