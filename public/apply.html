<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申请入驻 - 民宿服务卡片</title>
<style>
:root {
  --primary: #0d9488; --primary-dark: #0f766e;
  --bg: #f5f6f8; --card: #fff; --ink: #1a1a2e;
  --muted: #889999; --border: #eef0f4;
  --rounded: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background: linear-gradient(160deg, #f0fdfa 0%, #f5f6f8 50%, #e6f7f5 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.card { background:var(--card); border-radius:var(--rounded); padding:36px 32px; max-width:460px; width:100%; box-shadow:0 8px 32px rgba(0,0,0,0.08); }
h1 { font-size:24px; color:var(--ink); text-align:center; margin-bottom:4px; }
.sub { text-align:center; color:var(--muted); font-size:14px; margin-bottom:24px; }
.fg { margin-bottom:14px; }
.fg label { display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:4px; }
.fg input, .fg select { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:14px; outline:none; background:#f9fafb; transition:border-color 0.15s; }
.fg input:focus, .fg select:focus { border-color:var(--primary); background:#fff; }
.btn { width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; margin-top:4px; transition:background 0.15s; }
.btn:hover { background:var(--primary-dark); }
.success { text-align:center; padding:20px 0; }
.success .icon { font-size:56px; margin-bottom:12px; }
.success h2 { font-size:20px; color:var(--ink); margin-bottom:8px; }
.success p { color:var(--muted); font-size:14px; line-height:1.7; }
.err { color:#c62828; font-size:13px; text-align:center; margin-top:6px; min-height:18px; }
</style>
</head>
<body>
<div class="card" id="formCard">
  <h1>🏡 申请入驻</h1>
  <p class="sub">开通你的专属服务卡片，让客人住得更舒心</p>
  <form id="applyForm">
    <div class="fg"><label>你的姓名 *</label><input id="fName" type="text" placeholder="怎么称呼你" required></div>
    <div class="fg"><label>店铺名称 *</label><input id="fStore" type="text" placeholder="你的民宿/酒店叫啥名" required></div>
    <div class="fg"><label>业态类型</label>
      <select id="fType"><option value="homestay">🏡 民宿</option><option value="hotel">🏨 酒店</option><option value="apartment">🏢 公寓</option></select>
    </div>
    <div class="fg"><label>手机号</label><input id="fPhone" type="text" placeholder="审核通过后短信通知你"></div>
    <div class="fg"><label>微信号</label><input id="fWechat" type="text" placeholder="方便我们联系你"></div>
    <button class="btn" type="submit">提交申请</button>
  </form>
  <p class="err" id="msg"></p>
</div>

<script>
document.getElementById('applyForm').onsubmit = async (e) => {
  e.preventDefault();
  const body = {
    name: document.getElementById('fName').value.trim(),
    store_name: document.getElementById('fStore').value.trim(),
    property_type: document.getElementById('fType').value,
    phone: document.getElementById('fPhone').value.trim(),
    wechat: document.getElementById('fWechat').value.trim(),
  };
  if (!body.name || !body.store_name) {
    document.getElementById('msg').textContent = '请填写姓名和店铺名称';
    return;
  }
  document.getElementById('msg').textContent = '提交中...';
  const r = await fetch('/api/apply', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  const d = await r.json();
  if (d.success) {
    document.getElementById('formCard').innerHTML = `
      <div class="success">
        <div class="icon">✅</div>
        <h2>申请已提交</h2>
        <p>我们会在 24 小时内审核你的申请，<br>审核通过后会通过微信/短信通知你。<br><br>如有疑问请联系客服。</p>
      </div>`;
  } else {
    document.getElementById('msg').textContent = d.error || '提交失败';
  }
};
</script>
</body>
</html>
