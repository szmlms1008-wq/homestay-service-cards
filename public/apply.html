<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宿说 - 商家登录</title>
<link rel="stylesheet" href="/design-system.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background: linear-gradient(160deg, #f0fdfa 0%, #f5f6f8 50%, #e6f7f5 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.card { background:var(--surface); border-radius:var(--radius-md); padding:36px 32px; max-width:420px; width:100%; box-shadow:0 8px 32px rgba(0,0,0,0.08); position:relative; overflow:hidden; }
h1 { font-size:22px; color:var(--ink); text-align:center; margin-bottom:4px; }
.sub { text-align:center; color:var(--muted); font-size:14px; margin-bottom:24px; }
.fg { margin-bottom:14px; }
.fg label { display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:4px; }
.fg input, .fg select { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:14px; outline:none; background:#f9fafb; transition:border-color 0.15s; }
.fg input:focus, .fg select:focus { border-color:var(--primary); background:#fff; }
.btn { width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; margin-top:4px; transition:background 0.15s; }
.btn:hover { background:var(--primary-dark); }
.err { color:#c62828; font-size:13px; text-align:center; margin-top:8px; min-height:18px; }
.success-banner { background:var(--success-bg); color:var(--success); padding:10px 14px; border-radius:8px; font-size:13px; text-align:center; margin-bottom:16px; }
.back-link { display:inline-flex; align-items:center; gap:4px; font-size:13px; color:var(--muted); cursor:pointer; margin-bottom:16px; border:none; background:none; }
.back-link:hover { color:var(--primary); }
.apply-hint { text-align:center; margin-top:24px; padding-top:20px; border-top:1px solid var(--border-light); }
.apply-hint span { font-size:13px; color:var(--muted); }
.apply-hint a { color:var(--primary); font-size:13px; font-weight:500; cursor:pointer; text-decoration:none; }
.apply-hint a:hover { text-decoration:underline; }
.panels { position:relative; }
.panel { transition: opacity 0.25s, transform 0.25s; }
.panel-hidden { display:none; }
@media (max-width:480px) {
  .card { padding:24px 18px; border-radius:12px; }
  h1 { font-size:20px; }
  .fg input, .fg select { font-size:16px; }
}
</style>
</head>
<body>
<div class="card" id="formCard">

  <!-- ========== 登录面板（默认） ========== -->
  <div id="panelLogin" class="panel">
    <div style="font-size:40px;text-align:center;margin-bottom:8px;">🏡</div>
    <h1>商家登录</h1>
    <p class="sub">登录管理你的服务卡片</p>
    <div id="loginBanner" style="display:none;"></div>
    <form id="loginForm">
      <div class="fg"><label>用户名</label><input id="lUser" type="text" placeholder="输入用户名" required></div>
      <div class="fg"><label>密码</label><input id="lPass" type="password" placeholder="输入密码" required></div>
      <button class="btn" type="submit">登 录</button>
    </form>
    <p class="err" id="lMsg"></p>
    <div class="apply-hint">
      <span>还没有账号？</span>
      <a onclick="showApply()">申请入驻 →</a>
    </div>
  </div>

  <!-- ========== 申请面板（隐藏） ========== -->
  <div id="panelApply" class="panel panel-hidden">
    <button class="back-link" onclick="showLogin()">← 返回登录</button>
    <div style="font-size:32px;text-align:center;margin-bottom:4px;">📝</div>
    <h1>申请入驻</h1>
    <p class="sub">开通你的专属服务卡片，30秒搞定</p>
    <form id="applyForm">
      <div class="fg"><label>你的姓名 *</label><input id="fName" type="text" placeholder="怎么称呼你" required></div>
      <div class="fg"><label>店铺名称 *</label><input id="fStore" type="text" placeholder="你的民宿/酒店叫啥名" required></div>
      <div class="fg"><label>业态类型</label>
        <select id="fType"><option value="homestay">🏡 民宿</option><option value="hotel">🏨 酒店</option><option value="apartment">🏢 公寓</option></select>
      </div>
      <div class="fg"><label>手机号</label><input id="fPhone" type="text" placeholder="审核通过后短信通知你"></div>
      <div class="fg"><label>微信号</label><input id="fWechat" type="text" placeholder="方便我们联系你"></div>
      <button class="btn" type="submit">提交申请</button>
    </form>
    <p class="err" id="msg"></p>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

function showApply() {
  $('panelLogin').classList.add('panel-hidden');
  $('panelApply').classList.remove('panel-hidden');
  $('lMsg').textContent = '';
}

function showLogin(msg) {
  $('panelApply').classList.add('panel-hidden');
  $('panelLogin').classList.remove('panel-hidden');
  $('msg').textContent = '';
  if (msg) {
    $('loginBanner').style.display = '';
    $('loginBanner').className = 'success-banner';
    $('loginBanner').textContent = msg;
  }
}

// URL 参数：支持预填和直接切到登录
(function(){
  const params = new URLSearchParams(window.location.search);
  const u = params.get('u'), t = params.get('t');
  if (u) { setTimeout(() => { $('lUser').value = u; }, 100); }
  // 默认就是登录面板，无需切换
})();

// 申请提交
$('applyForm').onsubmit = async (e) => {
  e.preventDefault();
  const body = {
    name: $('fName').value.trim(),
    store_name: $('fStore').value.trim(),
    property_type: $('fType').value,
    phone: $('fPhone').value.trim(),
    wechat: $('fWechat').value.trim(),
  };
  if (!body.name || !body.store_name) { $('msg').textContent = '请填写姓名和店铺名称'; return; }
  $('msg').textContent = '提交中...';
  const r = await fetch('/api/apply', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  const d = await r.json();
  if (d.success) {
    // 回到登录页，显示成功横幅
    $('applyForm').reset();
    showLogin('✅ 申请已提交！审核通过后我们会通知你，届时用分配的账号在此登录。');
  } else {
    $('msg').textContent = d.error || '提交失败，请重试';
  }
};

// 登录提交
$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  $('lMsg').textContent = '登录中...';
  const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:$('lUser').value,password:$('lPass').value}) });
  const d = await r.json();
  if (d.token) {
    localStorage.setItem('card_token', d.token);
    localStorage.setItem('card_user', JSON.stringify(d.user));
    if (d.user.role === 'admin') {
      window.location.href = '/admin';
    } else {
      const props = await fetch('/api/me/properties', { headers: {'Authorization': 'Bearer ' + d.token} });
      const propsData = await props.json();
      if (propsData.length > 0) {
        window.location.href = '/p/' + propsData[0].slug + '/admin';
      } else {
        $('panelLogin').innerHTML = `
          <div style="text-align:center;padding:20px 0;">
            <div style="font-size:48px;margin-bottom:12px;">⏳</div>
            <h2>登录成功</h2>
            <p style="color:var(--muted);margin:8px 0;">你的店铺正在审核中，审核通过后我们会通知你。</p>
            <p style="font-size:13px;color:var(--muted-light);">届时在此登录即可管理店铺</p>
          </div>`;
      }
    }
  } else {
    $('lMsg').textContent = d.error || '登录失败';
  }
};
</script>
</body>
</html>
