<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平台管理后台</title>
<style>
:root {
  --primary: #0d9488; --primary-dark: #0f766e; --bg: #f5f6f8;
  --card: #fff; --ink: #1a1a2e; --muted: #889999; --border: #eef0f4;
  --rounded: 12px; --shadow: 0 1px 3px rgba(0,0,0,0.04);
  --font: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--ink); display:flex; min-height:100vh; }
.sidebar {
  width:220px; background:var(--card); border-right:1px solid var(--border);
  padding:20px 0; flex-shrink:0;
}
.sidebar h2 { font-size:16px; padding:0 20px 16px; }
.sidebar a {
  display:block; padding:10px 20px; font-size:14px; color:var(--ink);
  text-decoration:none; border-left:3px solid transparent; cursor:pointer;
  transition:all 0.12s;
}
.sidebar a:hover, .sidebar a.active { color:var(--primary); background:var(--bg); border-left-color:var(--primary); }
.main { flex:1; padding:28px; overflow-y:auto; max-width:960px; }
.main h1 { font-size:20px; margin-bottom:22px; }
.card { background:var(--card); border-radius:var(--rounded); padding:20px; box-shadow:var(--shadow); margin-bottom:16px; }
.card h3 { font-size:16px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
.stat { background:var(--card); border-radius:var(--rounded); padding:18px; box-shadow:var(--shadow); text-align:center; }
.stat .num { font-size:28px; font-weight:800; color:var(--primary); }
.stat .lbl { font-size:12px; color:var(--muted); margin-top:4px; }
.btn {
  padding:8px 18px; border:none; border-radius:20px; font-size:13px; cursor:pointer;
  font-weight:500; transition:all 0.15s;
}
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-dark); }
.btn-danger { background:#c62828; color:#fff; }
.btn-danger:hover { background:#b71c1c; }
.btn-sm { padding:4px 12px; font-size:11px; }
input, select {
  padding:8px 12px; border:1px solid var(--border); border-radius:8px;
  font-size:13px; outline:none; background:var(--card);
}
input:focus, select:focus { border-color:var(--primary); }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:8px 12px; font-size:11px; color:var(--muted); text-transform:uppercase; border-bottom:2px solid var(--border); }
td { padding:10px 12px; border-bottom:1px solid var(--bg); }
.toast {
  position:fixed; bottom:24px; right:24px; background:var(--ink); color:#fff;
  padding:10px 20px; border-radius:20px; font-size:13px; z-index:9999; display:none;
}
.pill { display:inline-block; padding:2px 10px; border-radius:10px; font-size:11px; font-weight:500; }
.pill-homestay { background:#f0fdfa; color:#0d9488; }
.pill-hotel { background:#eff6ff; color:#2563eb; }
.pill-apartment { background:#faf5ff; color:#7c3aed; }
.gap { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.login-wrap { max-width:400px; margin:80px auto; text-align:center; }
.login-wrap input { width:100%; padding:12px; font-size:15px; margin-bottom:10px; }
.login-wrap .btn { width:100%; padding:12px; font-size:15px; }
</style>
</head>
<body>

<div class="sidebar" id="sidebar" style="display:none;">
  <h2>⚙️ 平台管理</h2>
  <a data-tab="overview" class="active" onclick="switchTab('overview')">📊 概览</a>
  <a data-tab="properties" onclick="switchTab('properties')">🏡 店铺管理</a>
  <a data-tab="users" onclick="switchTab('users')">👥 用户管理</a>
  <a data-tab="logs" onclick="switchTab('logs')">📋 操作日志</a>
  <a onclick="logout()" style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px;">🚪 退出登录</a>
</div>

<div class="main" id="mainContent"></div>
<div class="toast" id="toast"></div>

<script>
const TOKEN = localStorage.getItem('card_token') || '';
const USER = JSON.parse(localStorage.getItem('card_user') || 'null');

function authHeaders() {
  return TOKEN ? { 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN } : {};
}
async function api(method, path, body) {
  const opts = { method, headers: authHeaders() };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (r.status === 401) { localStorage.clear(); window.location.reload(); }
  return r.json();
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2000);
}

// ====== 登录 ======
if (!TOKEN || !USER || USER.role !== 'admin') {
  document.getElementById('mainContent').innerHTML = `
    <div class="login-wrap">
      <div style="font-size:48px;">🔐</div>
      <h1 style="margin:12px 0;">平台管理后台</h1>
      <form id="loginFm">
        <input id="lu" type="text" placeholder="管理员用户名" autocomplete="username">
        <input id="lp" type="password" placeholder="密码" autocomplete="current-password">
        <button class="btn btn-primary" type="submit">登 录</button>
      </form>
      <p id="lerr" style="color:#c62828;margin-top:8px;font-size:13px;"></p>
    </div>`;
  document.getElementById('loginFm').onsubmit = async (e) => {
    e.preventDefault();
    const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:document.getElementById('lu').value,password:document.getElementById('lp').value}) });
    const d = await r.json();
    if (d.token && d.user.role === 'admin') { localStorage.setItem('card_token',d.token); localStorage.setItem('card_user',JSON.stringify(d.user)); window.location.reload(); }
    else if (d.token) document.getElementById('lerr').textContent = '需要管理员权限';
    else document.getElementById('lerr').textContent = d.error || '登录失败';
  };
} else {
  document.getElementById('sidebar').style.display = '';
  switchTab('overview');
}

function logout() { localStorage.clear(); window.location.reload(); }

function switchTab(name) {
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
  const link = document.querySelector(`[data-tab="${name}"]`);
  if (link) link.classList.add('active');
  const loaders = { overview: loadOverview, properties: loadProperties, users: loadUsers, logs: loadLogs };
  if (loaders[name]) loaders[name]();
}

// ====== 概览 ======
async function loadOverview() {
  const [props, users, logs] = await Promise.all([
    api('GET','/api/admin/properties'),
    api('GET','/api/admin/users'),
    api('GET','/api/admin/logs')
  ]);
  const typeCounts = { homestay: props.filter(p=>p.property_type==='homestay').length, hotel: props.filter(p=>p.property_type==='hotel').length, apartment: props.filter(p=>p.property_type==='apartment').length };

  document.getElementById('mainContent').innerHTML = `
    <h1>📊 平台概览</h1>
    <div class="stats">
      <div class="stat"><div class="num">${props.length}</div><div class="lbl">总店铺数</div></div>
      <div class="stat"><div class="num">${users.length}</div><div class="lbl">注册用户</div></div>
      <div class="stat"><div class="num">${logs.length}</div><div class="lbl">操作记录</div></div>
      <div class="stat"><div class="num">${typeCounts.homestay+typeCounts.hotel+typeCounts.apartment}</div><div class="lbl">活跃业态</div></div>
    </div>
    <div class="card">
      <h3>🏡 业态分布</h3>
      <div style="display:flex;gap:24px;">
        <div><span class="pill pill-homestay">🏡 民宿</span> <strong>${typeCounts.homestay}</strong></div>
        <div><span class="pill pill-hotel">🏨 酒店</span> <strong>${typeCounts.hotel}</strong></div>
        <div><span class="pill pill-apartment">🏢 公寓</span> <strong>${typeCounts.apartment}</strong></div>
      </div>
    </div>
    <div class="card">
      <h3>📋 最新操作</h3>
      <table><thead><tr><th>时间</th><th>店铺</th><th>操作</th></tr></thead>
        <tbody>${logs.slice(0,10).map(l => `<tr><td>${l.created_at||''}</td><td>${l.property_slug||'-'}</td><td>${l.action}</td></tr>`).join('')}</tbody>
      </table>
    </div>
  `;
}

// ====== 店铺管理 ======
async function loadProperties() {
  const props = await api('GET', '/api/admin/properties');
  const users = await api('GET', '/api/admin/users');
  const ownerOpts = users.map(u => `<option value="${u.id}">${u.username}</option>`).join('');

  document.getElementById('mainContent').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">
      <h1 style="margin-bottom:0;">🏡 店铺管理</h1>
      <button class="btn btn-primary" onclick="showCreateForm()">➕ 创建店铺</button>
    </div>
    <div class="card" id="createForm" style="display:none;">
      <h3>创建新店铺</h3>
      <div class="gap" style="margin-bottom:12px;">
        <input id="fSlug" type="text" placeholder="URL标识 (英文)" style="width:160px;">
        <input id="fName" type="text" placeholder="店铺名称" style="width:200px;">
        <select id="fType"><option value="homestay">🏡 民宿</option><option value="hotel">🏨 酒店</option><option value="apartment">🏢 公寓</option></select>
        <select id="fOwner"><option value="">无店老板</option>${ownerOpts}</select>
        <input id="fPhone" type="text" placeholder="联系电话" style="width:140px;">
      </div>
      <div class="gap">
        <button class="btn btn-primary" onclick="createProperty()">✅ 创建</button>
        <button class="btn" onclick="document.getElementById('createForm').style.display='none'" style="background:#e5e7eb;">取消</button>
      </div>
    </div>
    <table>
      <thead><tr><th>店铺</th><th>URL</th><th>业态</th><th>店老板</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody>
        ${props.map(p => {
          const ownerName = users.find(u => u.id === p.owner_user_id)?.username || '-';
          const typePill = {homestay:'pill-homestay',hotel:'pill-hotel',apartment:'pill-apartment'};
          const typeLabel = {homestay:'🏡 民宿',hotel:'🏨 酒店',apartment:'🏢 公寓'};
          return `<tr>
            <td><strong>${p.name}</strong></td>
            <td><code>${p.slug}</code></td>
            <td><span class="pill ${typePill[p.property_type]||''}">${typeLabel[p.property_type]||p.property_type}</span></td>
            <td>${ownerName}</td>
            <td>${p.created_at||''}</td>
            <td class="gap">
              <a href="/p/${p.slug}" target="_blank" class="btn btn-sm" style="background:#e5e7eb;text-decoration:none;">👁 预览</a>
              <a href="/p/${p.slug}/admin" target="_blank" class="btn btn-sm btn-primary" style="text-decoration:none;">✏️ 管理</a>
              <button class="btn btn-sm btn-danger" onclick="deleteProperty(${p.id},'${p.slug}')">🗑</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

window.showCreateForm = () => document.getElementById('createForm').style.display = '';

window.createProperty = async () => {
  const body = {
    slug: document.getElementById('fSlug').value.trim(),
    name: document.getElementById('fName').value.trim(),
    property_type: document.getElementById('fType').value,
    owner_user_id: document.getElementById('fOwner').value ? parseInt(document.getElementById('fOwner').value) : null,
    contact_phone: document.getElementById('fPhone').value.trim(),
  };
  if (!body.slug || !body.name) return toast('slug 和名称必填');
  const r = await api('POST', '/api/admin/properties', body);
  if (r.success) { toast('店铺 ' + body.slug + ' 创建成功！访问: /p/' + body.slug); loadProperties(); }
  else toast(r.error || '创建失败');
};

window.deleteProperty = async (id, slug) => {
  if (!confirm('确定删除店铺「' + slug + '」吗？')) return;
  await api('DELETE', '/api/admin/properties/' + id);
  toast('已删除');
  loadProperties();
};

// ====== 用户管理 ======
async function loadUsers() {
  const users = await api('GET', '/api/admin/users');
  document.getElementById('mainContent').innerHTML = `
    <h1>👥 用户管理</h1>
    <table>
      <thead><tr><th>用户名</th><th>角色</th><th>注册时间</th><th>最后登录</th></tr></thead>
      <tbody>${users.map(u => `<tr><td><strong>${u.username}</strong></td><td>${u.role}</td><td>${u.created_at||''}</td><td>${u.last_login||'-'}</td></tr>`).join('')}</tbody>
    </table>
  `;
}

// ====== 操作日志 ======
async function loadLogs() {
  const logs = await api('GET', '/api/admin/logs');
  document.getElementById('mainContent').innerHTML = `
    <h1>📋 操作日志</h1>
    <table>
      <thead><tr><th>时间</th><th>店铺</th><th>操作</th><th>详情</th></tr></thead>
      <tbody>${logs.slice(0,50).map(l => `<tr><td style="white-space:nowrap;">${l.created_at||''}</td><td>${l.property_slug||'-'}</td><td>${l.action}</td><td style="color:var(--muted);font-size:12px;">${(l.details||'').substring(0,80)}</td></tr>`).join('')}</tbody>
    </table>
  `;
}
</script>
</body>
</html>
